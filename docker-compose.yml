services:
  postgres:
    image: postgres:16-alpine
    container_name: cama-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cama_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cama_pro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cama_pro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cama} -d ${POSTGRES_DB:-cama_pro}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cama_pro_pgdata:
